services:
  - type: web
    name: civicdesk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: civicdesk-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "1"
databases:
  - name: civicdesk-db
    plan: free
